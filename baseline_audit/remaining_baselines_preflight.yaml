contract:
  id: wave23_remaining_baselines_preflight
  version: "0.1.0"
  status: PRELIMINARY
  scope: registry_entries_and_public_information
  checkouts_present: false
  note: >
    None of the five remaining baselines are checked out under
    external/baselines/. This preflight records what is known from the
    registry and the paper audit trail. Exact-source audits with real
    checkouts are scheduled per baseline in later steps.

