  - PREFLIGHT_GO
  - PREFLIGHT_CONDITIONAL_GO
  - PREFLIGHT_BLOCKED
  - PREFLIGHT_DEFERRED_RESOURCE
  - PREFLIGHT_DEFERRED_INPUT_CONTRACT

forbidden_terminal_statuses:
