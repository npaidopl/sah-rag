architectural_observation:
  summary: 'Metadata-RAG metadata stage did not activate on three of the four corpora under the frozen min_match_ratio of 0.5. The architecture was measured as a dense-only BGE-M3 retriever on clerk, cuad and greek_bar_bench, and as a metadata-filtered dense retriever on lara.

    '
  fallback_rate_by_dataset:
    clerk: 0.999
    cuad: 0.976
    greek_bar_bench: 0.923
    lara: 0.337
  cause: 'Interaction between the frozen min_match_ratio of 0.5 and the constraint density of the corpora. Long judicial opinions in clerk produce 60+ constraints per query so no document reaches match_ratio >= 0.5; cuad queries are short templated prompts; greek_bar_bench queries are Greek while the frozen extractor is ASCII-only.

    '
  consequence: 'The comparison measures Metadata-RAG as a dense-only retriever on three corpora. No post-hoc threshold tuning is applied: the frozen specification is preserved exactly as declared.

    '
  post_hoc_tuning_applied: false
