documented_limitations:
- 'Reduced dataset scope: 4 of 7 canonical datasets executed. ruler, loong, long_bench_v2
  excluded.'
- LongRAG's unit granularity (K consecutive documents grouped into a ~4096-token unit)
  causes coarse document-level ranking on corpora whose documents are much shorter
  than the unit budget (clerk, cuad, greek_bar_bench). This is intrinsic to the paper's
  grouping policy when the corpus lacks Wikipedia-style hyperlink adjacency.
- Document-level metrics use first_occurrence_by_long_unit_rank expansion. When a
  document appears in multiple retrieved units, only its first occurrence is scored.
  This matches the reference implementation in rag_system.baselines.longrag.
- 'Embeddings: FP16 GPU (Colab T4). Query embeddings: FP16 GPU, max_length=4098. Both
  use the pinned BGE-M3 revision 5617a9f61b028005a4858fdac845db406aefb181.'
- 'cuad: 14208 of 20910 queries have zero relevant documents and are excluded per
  common_retrieval_evaluation_contract.yaml.'
