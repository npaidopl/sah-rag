comparison_baseline: longrag_full_track
comparison_ready: true
controlled_adaptations:
- equivalence_basis: Identical dense cosine, sparse dot-product, RRF (k=60), parent
    aggregation (w=0.05), and document resolution. Only the execution substrate changed.
  equivalence_claimed: true
  id: qdrant_to_numpy_retrieval
  rationale: Qdrant local mode is brute-force and scales poorly with point count (>20k
    points -> >1s/query). Replaced with mathematically equivalent in-memory numpy+scipy
    computation.
- equivalence_claimed: false
  id: query_dense_reexposure
  rationale: Dense query embeddings were regenerated for My_RAG rather than reused
    from the LongRAG cache. Config hash differs due to prefix string (hybrid vs dense).
    Not verified as byte-identical.
documented_limitations:
- Reduced dataset scope (4 of 7 datasets).
- numpy-based retrieval is a controlled adaptation of the Qdrant-native RRF path;
  controlled equivalence argument rests on mathematical identity, not empirical verification.
- Same embedding and inference precision as LongRAG (FP16, GPU).
- 'cuad: zero-relevance queries excluded per common evaluator contract.'
