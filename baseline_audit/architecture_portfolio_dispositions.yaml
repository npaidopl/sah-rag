execution_gate:
  publishable_execution_allowed: false
  blockers:
    - Three CONDITIONAL_GO architectures have not reached READY_FOR_DATA.
    - Two architectures are deferred with validated reasons.
    - Dataset-envelope validation has not run against a real dataset.
    - Execution-environment registry has not been frozen.
    - No infrastructure-only execution pilot has completed.
  allowed_now:
    - Infrastructure-only pilot planning.
    - Dataset-envelope validation.
    - Environment preflight.
    - Resource estimation.
    - Failure and resume simulation.
    - Project-owned implementation work for CONDITIONAL_GO slots.
  prohibited_now:
    - Publishable benchmark execution.
    - Full dataset-by-architecture matrix execution.
    - Final comparison tables.
    - Paper-level effectiveness claims.
    - Execution of blocked foreign repositories.

re_evaluation_policy:
  semantic_status_changes_require_new_registry_version: true
  triggers:
    disretrieval:
      - Explicit software license is published.
      - Clean-room comparator reaches retrieval readiness.
    memorag:
      - Model licenses are approved.
      - Approved GPU environment becomes available.
      - Canonical retrieval instrumentation validates.
    kag:
      - OpenSPG service environment is approved.
      - Graph backend is available.
      - LLM access and cost budget are approved.
    metadata_rag:
      - Clean-room specification is frozen.
      - Typed implementation and smoke validate.
    hikey:
      - Official source becomes available.
      - Multimodal contract version 0.2.0 is approved.
      - Compatible PDF datasets are verified.
      - Parser and model licenses are approved.
      - Multimodal GPU environment is approved.
