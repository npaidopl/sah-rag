rationale: |
  This commit was chosen over HEAD (ba92f95) for the following reasons.

  (a) All paper-faithful files are frozen at or before this commit:
        - utils/gpt_inference.py            last changed at edecd38 (before pin)
        - utils/gemini_inference.py         last changed at edecd38 (before pin)
        - scripts/run_retrieve_tevatron.sh  last changed at ef3af5d (before pin)
        - scripts/run_eval_qa.sh            last changed at 778454e (this commit)
        - requirements.txt                  last changed at 778454e (this commit)
        - LICENSE                           last changed at 82759a6 (before pin)
      None of these files were modified after this commit (verified with
      `git log 778454e..HEAD -- <path>` returning empty for each).

  (b) This commit precedes the last two Claude-related changes:
        - ca0c208 (2024-06-24 04:40) "update claude eval"
            modifies utils/claude_inference.py (+21/-7)
        - 9a8a08d (2024-06-25 11:52) "add claude sonnet samples"
            adds exp/nq_claude_3.5_sonnet.json
      Note: utils/claude_inference.py was created earlier, at 07023c9
      ("reader api utils"); it was NOT created after this pin. The paper
      reports only GPT-4o and Gemini-1.5-Pro; the pre-existing Claude
      file is not used by any paper-faithful code path. The two post-pin
      Claude commits are excluded to keep the pin as close as possible
      to the configuration the authors reported in the paper.

  (c) This commit precedes "update the preprocess" (89c0c89, 2024-07-08),
      which modifies scripts/process_wiki_page.sh. The preprocessing
      path is not used when the author-supported pre-processed corpus
      (HuggingFace TIGER-Lab/LongRAG) is used, which is the recommended
      path for Stage B (avoids re-running the full Wikipedia dump
      extraction).

  (d) This commit precedes two README-only edits at the tail of the
      repository (38d741c and ba92f95). Those edits do not affect any
      executable code.

  Summary: 778454e is the last commit at which every file needed for a
  native LongRAG run (retrieval, reader, prompt, requirements) is in
  its final paper-era form, before any post-paper additions.
