# MemoRAG controlled pilot manifest
# Mode: controlled (BGE-M3 injected by orchestrator; generation disabled)
# Purpose: prove the controlled-adaptation path runs under the v2 contract.
#
# The memory model remains native. The clue stage remains native.
# Only the embedder is injected. Final answer generation is disabled
# per docs/adapter_contract.md Section 9.

pilot_id: memorag_controlled_pilot_v1
baseline: memorag
mode: controlled
frozen_at_utc: <PIN_ME>

source:
  repo: https://github.com/qhjqhj00/MemoRAG
  commit: 7c23dfa855289a2a99fe72c98e024105196ce01e   # <PIN_ME on GPU host>
  install: pip install git+https://github.com/qhjqhj00/MemoRAG@<PIN_ME>

models:
  # Architecture-defining memory model. Stays native.
  memory:
    id: TommyChien/memorag-qwen2-7b-inst
    revision: <PIN_ME>

  # Injected by the orchestrator. Recorded here for reproducibility.
  injected_embedder:
    id: BAAI/bge-m3
    revision: <PIN_ME>
    source: project_hf_cache
  injected_llm:
    id: <PIN_ME by orchestrator>
    revision: <PIN_ME by orchestrator>
    usage: not_used_for_generation

generation:
  # v2 contract: IR-only. Generation disabled.
  enabled: false

context:
  max_tokens: 400000             # <PIN_ME after VRAM measurement>
  clue_count: <PIN_ME>

execution:
  host: university_gpu
  cuda_required: true
  min_vram_gb: <PIN_ME>
  python: ">=3.12,<3.13"

seeds:
  global: 42
  torch: 42
  numpy: 42

artifacts:
  dir: pilot/artifacts/controlled_<timestamp>/
  expected:
    - env.txt
    - probe.json
    - load.log
    - retrieve_probe.json

frozen_invariants:
  - memory model id
  - clue stage presence
  - clue-conditioned retrieval
  - generation disabled