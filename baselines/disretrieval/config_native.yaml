name: disretrieval
mode: native
top_k: 10
extra:
  native_fidelity: PAPER_EXACT_NATIVE
  native_status: READY_BUT_BLOCKED_MISSING_BACKBONE
  legal_risk: true
  native_clearance_required: true

  # Paper-exact components. All required for native execution.
  paper_embedder_name: sentence-transformers/multi-qa-mpnet-base-cos-v1
  native_embedder_root: ${RAG_NATIVE_EMBEDDER_ROOT}
  native_backbone_root: ${RAG_NATIVE_BACKBONE_ROOT}

  # Summarizer LLM. The paper supports TWO configs:
  #   A. vLLM local (main config, free) — set native_vllm_model below
  #   B. Llama API (paid config) — set env var LLAMA_API_KEY
  native_vllm_model: null      # e.g. "meta-llama/Llama-3.1-8B-Instruct"
  # Or: set env var LLAMA_API_KEY for the paid API config

  # Paper's full hyperparameters
  rst_parser:
    type: E-NNRSTParser
    head_weights: rst_parser/saved_model/100/model
    backbone: xlm_rst_tuned
    backbone_status: MISSING_FROM_OFFICIAL_REPO
  retrieval:
    method: rest_topk
    leaf_topk: 5
    max_len: 400
    max_node_depth: 10000
    rank_order: false
  summarization:
    temperature: 0.95
    top_p: 0.7
    top_k: 50
    max_new_tokens: 1024

  # Native blockers (documented for reproducibility)
  native_blocker_reasons:
    - "DISRetrieval paper-exact XLNet backbone (xlm_rst_tuned) is not distributed. Only the parser head weights (saved_model/100/model) are published."
    - "The bundled training data (train.rst, 9.74 MB) is CJK-tokenized, not RST-DT. Reproducing the paper config requires the exact original training corpus, which is not published."
    - "The official repo carries no LICENSE file (default copyright applies)."

  # Fallback guidance
  native_fallback_note: >
    Switch to `mode: controlled` (config_controlled.yaml) for a
    defensible academic alternative that uses the upstream E-NNRSTParser
    (Apache-2.0) backbone. Controlled mode is CONTROLLED_ADAPTATION, not
    native; it must be reported as such.