# =====================================================================
# run_manifest_full.yaml  (v2, realistic)
# Runs on GPU WITH API keys + extra downloads (~14GB).
# 306 cells: 153 controlled + 153 native
# Time estimate: 5-7 days on single GPU.
#
# Preconditions (must be true before running):
#   1. GPU with >= 40GB VRAM (14B) or >= 80GB (14B + 32B)
#   2. OPENAI_API_KEY set (for longrag, hipporag2, multi_meta_rag native)
#   3. Qwen 7B downloaded (~14GB, for memorag native)
#   4. SPLADE-v3 weights downloaded (~440MB)
#   5. (Optional) CUDA-visible GPU for real embeddings
#   6. (Optional) xlm_rst_tuned backbone for disretrieval native (external)
#
# EXCLUDED from native (structural blocks, not fixable by downloads):
#   colbertv2    -> Windows ABI incompatibility (Linux-only)
#   disretrieval -> missing xlm_rst_tuned backbone (contact authors)
#   pathrag      -> reported-only (no LICENSE)
#   kag          -> reported-only (GPU server migration pending)
#   hikey        -> reported-only (standalone, not orchestrated)
# =====================================================================
version: "1.0"
global:
  output_root: "outputs/run_all_full"
  stop_on_fatal: false                 # continue on stage failure
  allow_partial: true                  # continue on cell failure
  log_level: INFO

preflight:
  check_env:
    - RAG_CANONICAL_ROOT
    - RAG_INDOOR_LLM_ROOT
    - RAG_EMBEDDER_ROOT
    # - OPENAI_API_KEY                 # uncomment if provisioning
  check_models:
    - Qwen/Qwen2.5-14B-Instruct
    - BAAI/bge-m3
    - Qwen/Qwen2.5-32B-Instruct        # optional generation
    - BAAI/bge-large-en-v1.5           # for multi_meta_rag native
  check_datasets:
    required_ids:
      - clerk
      - cuad
      - greek_bar_bench
      - lara
      - 2wiki
      - frames
      - hotpotqa
      - long_bench_v2
      - loong
      - m3docvqa
      - multifieldqa_en
      - multihop_rag
      - musique
      - narrativeqa
      - qasper
      - quality
      - ruler

optimal_operation:
  enabled: true
  skip_gpu: false

ablation:
  enabled: true
  tier: 1

controlled_adaptation:
  enabled: true
  top_k: 10
  baselines:
    - disretrieval
    - longrag
    - lightrag
    - hipporag2
    - raptor
    - metadata_rag
    - memorag
    - splade
    - multi_meta_rag
  datasets: &all_datasets
    - clerk
    - cuad
    - greek_bar_bench
    - lara
    - 2wiki
    - frames
    - hotpotqa
    - long_bench_v2
    - loong
    - m3docvqa
    - multifieldqa_en
    - multihop_rag
    - musique
    - narrativeqa
    - qasper
    - quality
    - ruler

native_e2e:
  enabled: true
  top_k: 10
  baselines:
    - bm25                             # no LLM
    - metadata_rag                     # no LLM
    - raptor                           # Qwen 1.5B local
    - lightrag                         # Qwen 1.5B local
    - memorag                          # Qwen 7B local (download required)
    - splade                           # local weights (download required)
    - longrag                          # gpt-4o reader (API key required)
    - hipporag2                        # gpt-4o-mini OpenIE (API key required)
    - multi_meta_rag                   # gpt-3.5 extraction (API key required)
  datasets: *all_datasets

reporting:
  enabled: true
  aggregate_metrics: true
  generate_summary: true
  generate_closure_manifest: true