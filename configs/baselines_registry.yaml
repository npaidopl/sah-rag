version: 1
defaults:
  status: reported
  modes:
  - native
  top_k: 10
  work_dir_template: baselines/{name}
baselines:
- name: disretrieval
  display_name: DisRetrieval
  paper: Liu et al., Disentangled Retrieval for Long-Context QA
  path: baselines/disretrieval
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Update status to executable once adapter is merged.
- name: hikey
  display_name: HiKEY
  paper: HiKEY — Hierarchical Key Information Extraction
  path: baselines/hikey
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Update status to executable once adapter is merged.
- name: pathrag
  display_name: PathRAG
  paper: PathRAG — Path-based Reasoning RAG
  path: baselines/pathrag
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Graph-based; controlled mode may need extra component injection review.
- name: longrag
  display_name: LongRAG
  paper: LongRAG — Long-Context Retrieval-Augmented Generation
  path: baselines/longrag_v2
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Existing adapter from v1, migrated to v2. Reference implementation.
- name: lightrag
  display_name: LightRAG
  version: 0.1.0
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: true
  modes:
  - native
  - controlled
  license: MIT
  paper: arXiv:2410.05779
  path: baselines/lightrag
  adapter: baselines/lightrag/adapter.py
  config_native: baselines/lightrag/config_native.yaml
  config_controlled: baselines/lightrag/config_controlled.yaml
  repo: https://github.com/HKUDS/LightRAG
  commit: 453dce83d6d0354a06e46c8d4029a0895c4e054b
  native_tag: AUTHOR_SUPPORTED_NATIVE
  controlled_tag: CONTROLLED_ADAPTATION
  notes: Fallback path tested offline (contract-compliant). Full vendored pipeline
    provisioned for GPU server (returns NotImplementedError until implemented). strict_full_path=true
    in production configs prevents silent fallback.
- name: hipporag2
  display_name: HippoRAG2
  paper: HippoRAG2 — Hippocampal-inspired RAG
  path: baselines/hipporag2
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: PPR-based; graph index persistence needed.
- name: raptor
  display_name: RAPTOR
  paper: RAPTOR — Recursive Abstractive Processing for Tree-Organized Retrieval
  path: baselines/raptor
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Recursive tree; controlled mode needs cluster-summary generation via injected
    LLM.
- name: metadata_rag
  display_name: Metadata-RAG
  paper: Metadata-Enriched RAG with Windowing
  path: baselines/metadata_rag
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Existing adapter from v1, migrated to v2. Reference implementation.
- name: memorag
  display_name: MemoRAG
  paper: MemoRAG — Memory-Augmented RAG
  path: baselines/memorag
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Memory-based; controlled mode requires reviewing KV-cache injection.
- name: kag
  display_name: KAG
  paper: KAG — Knowledge Augmented Generation
  path: baselines/kag
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Knowledge-graph; controlled mode needs KG component review.
- name: bm25
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: false
  notes: 'Lexical baseline (Pyserini/Anserini). Native-fidelity: PAPER_EXACT_NATIVE
    (SciFact). Controlled-mode components structurally unused (see baselines/bm25/ARM_REGISTRY.md
    section 2).'
- name: splade
  version: 0.1.0
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: false
  modes:
  - native
  - controlled
  license: CC BY-NC-SA 4.0 (weights)
  paper: arXiv:2403.06789
  adapter: baselines/splade/adapter.py
  config_native: baselines/splade/config_native.yaml
  config_controlled: baselines/splade/config_controlled.yaml
  native_model: naver/splade-v3
- name: colbertv2
  version: 0.1.0
  display_name: ColBERTv2
  status: executable
  supports_native: true
  supports_controlled: false
  is_llm_based: false
  modes:
  - native
  license: MIT
  paper: arXiv:2112.01488
  adapter: baselines/colbertv2/adapter.py
  config_native: baselines/colbertv2/config_native.yaml
  config_controlled: baselines/colbertv2/config_controlled.yaml
  native_model: colbert-ir/colbertv2.0
  notes: 'Retrieval-only late-interaction architecture. Native E2E terminates at IR
    (no generation stage in paper/repo). Controlled mode architecturally impossible:
    BGE-M3 dense vectors are incompatible with ColBERTv2 token-level late interaction.
    See baselines/colbertv2/README.md.'
- name: multi_meta_rag
  display_name: Multi-Metadata RAG
  paper: Companion B (REPORT_v2.tex)
  path: baselines/multi_meta_rag
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Dual-mode. Native requires OPENAI_API_KEY + bge-large-en-v1.5 (deferred).
    Controlled ready with injected BGE-M3.
