version: 1
defaults:
  status: reported
  modes:
  - native
  top_k: 10
  work_dir_template: baselines/{name}
baselines:
- name: disretrieval
  display_name: DISRetrieval
  paper: >
    Chen et al., "Beyond Chunking: Discourse-Aware Hierarchical
    Retrieval for Long Document Question Answering",
    arXiv:2506.06313 (ACL 2026)
  paper_url: https://arxiv.org/abs/2506.06313
  code_url: https://github.com/DreamH1gh/ACL2026-DISRetrieval
  commit: 4f3144042c6eb1e514a0a89ec704d892a66e700c
  path: baselines/disretrieval
  status: executable
  modes:
  - controlled
  is_llm_based: true
  supports_native: false
  supports_controlled: true
  native_tag: PAPER_EXACT_NATIVE_BLOCKED
  controlled_tag: CONTROLLED_ADAPTATION
  native_status: BLOCKED_MISSING_BACKBONE
  legal_risk_native: true
  controlled_parser: E-NNRSTParser (upstream, Apache-2.0)
  controlled_summarizer: Qwen2.5-1.5B-Instruct
  controlled_embedder: BGE-M3 (injected)
  precomputed_trees_root: D:/rag_work/disretrieval_trees
  license:
    upstream_parser: Apache-2.0
    official_repo: None (default copyright)
    parser_head_weights: unlicensed
    xlnet_backbone: missing from repo
  notes: >
    Native mode is BLOCKED, not deferred. The official repo ships parser
    head weights (saved_model/100/model) but omits the fine-tuned XLNet
    backbone (xlm_rst_tuned/), which is required to load the head. The
    bundled training data is CJK-tokenized, not RST-DT. Controlled mode
    uses the upstream E-NNRSTParser (Apache-2.0) as the neural RST
    parser, combined with the DISRetrieval architecture-defining logic
    (rest_topk traversal, leaf expansion, evidence assembly). Precomputed
    trees are produced by scripts/precompute_trees.py in the dedicated
    venv (torch 2.2.2, transformers 4.42.3, Python 3.11).
- name: hikey
  display_name: HiKEY
  paper: HiKEY — Hierarchical Key Information Extraction
  path: baselines/hikey
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Update status to executable once adapter is merged.
- name: pathrag
  display_name: PathRAG
  paper: PathRAG — Path-based Reasoning RAG
  path: baselines/pathrag
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Graph-based; controlled mode may need extra component injection review.
- name: longrag
  display_name: LongRAG
  paper: LongRAG — Long-Context Retrieval-Augmented Generation
  path: baselines/longrag_v2
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Existing adapter from v1, migrated to v2. Reference implementation.
- name: lightrag
  display_name: LightRAG
  version: 0.1.0
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: true
  modes:
  - native
  - controlled
  license: MIT
  paper: arXiv:2410.05779
  path: baselines/lightrag
  adapter: baselines/lightrag/adapter.py
  config_native: baselines/lightrag/config_native.yaml
  config_controlled: baselines/lightrag/config_controlled.yaml
  repo: https://github.com/HKUDS/LightRAG
  commit: 453dce83d6d0354a06e46c8d4029a0895c4e054b
  native_tag: AUTHOR_SUPPORTED_NATIVE
  controlled_tag: CONTROLLED_ADAPTATION
  notes: Fallback path tested offline (contract-compliant). Full vendored pipeline
    provisioned for GPU server (returns NotImplementedError until implemented). strict_full_path=true
    in production configs prevents silent fallback.
- name: hipporag2
  display_name: HippoRAG2
  paper: HippoRAG2 — Hippocampal-inspired RAG
  path: baselines/hipporag2
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: PPR-based; graph index persistence needed.
- name: raptor
  display_name: RAPTOR
  version: 0.1.0
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: true
  modes:
  - native
  - controlled
  license: MIT
  paper: 'RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval'
  path: baselines/raptor
  adapter: baselines/raptor/adapter.py
  config_native: baselines/raptor/config_native.yaml
  config_controlled: baselines/raptor/config_controlled.yaml
  native_tag: AUTHOR_SUPPORTED_NATIVE
  controlled_tag: CONTROLLED_ADAPTATION
  notes: 'Graduated from workspace. Recursive GMM+UMAP tree with LLM summarization
    at every level; collapsed-tree retrieval (paper-preferred variant; Sec 4.2 reports
    +2-4.5pp over tree-traversal). Native mode uses local Qwen2.5-1.5B-Instruct +
    BGE-M3 via official author-supported interfaces; paper-exact not claimed. IR-only
    per v2 scope.'
- name: metadata_rag
  display_name: Metadata-RAG
  paper: Metadata-Enriched RAG with Windowing
  path: baselines/metadata_rag
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Existing adapter from v1, migrated to v2. Reference implementation.
- name: memorag
  display_name: MemoRAG
  paper: MemoRAG — Memory-Augmented RAG
  path: baselines/memorag
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Author-supported native MemoRAG. Clue stage preserved (architecture-defining). Pilot scripts under baselines/memorag/pilot/.
- name: kag
  display_name: KAG
  paper: KAG — Knowledge Augmented Generation
  path: baselines/kag
  status: reported
  modes:
  - native
  - controlled
  is_llm_based: true
  notes: Knowledge-graph; controlled mode needs KG component review.
- name: bm25
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: false
  notes: 'Lexical baseline (Pyserini/Anserini). Native-fidelity: PAPER_EXACT_NATIVE
    (SciFact). Controlled-mode components structurally unused (see baselines/bm25/ARM_REGISTRY.md
    section 2).'
- name: splade
  version: 0.1.0
  status: executable
  supports_native: true
  supports_controlled: true
  is_llm_based: false
  modes:
  - native
  - controlled
  license: CC BY-NC-SA 4.0 (weights)
  paper: arXiv:2403.06789
  adapter: baselines/splade/adapter.py
  config_native: baselines/splade/config_native.yaml
  config_controlled: baselines/splade/config_controlled.yaml
  native_model: naver/splade-v3
- name: colbertv2
  version: 0.1.0
  display_name: ColBERTv2
  status: executable
  supports_native: true
  supports_controlled: false
  is_llm_based: false
  modes:
  - native
  license: MIT
  paper: arXiv:2112.01488
  adapter: baselines/colbertv2/adapter.py
  config_native: baselines/colbertv2/config_native.yaml
  config_controlled: baselines/colbertv2/config_controlled.yaml
  native_model: colbert-ir/colbertv2.0
  notes: 'Retrieval-only late-interaction architecture. Native E2E terminates at IR
    (no generation stage in paper/repo). Controlled mode architecturally impossible:
    BGE-M3 dense vectors are incompatible with ColBERTv2 token-level late interaction.
    See baselines/colbertv2/README.md.'
- name: multi_meta_rag
  display_name: Multi-Metadata RAG
  paper: Companion B (REPORT_v2.tex)
  path: baselines/multi_meta_rag
  status: executable
  modes:
  - native
  - controlled
  is_llm_based: false
  notes: Dual-mode. Native requires OPENAI_API_KEY + bge-large-en-v1.5 (deferred).
    Controlled ready with injected BGE-M3.
